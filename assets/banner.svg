<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0000ff" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <style>
      .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
      .cyber-circle { fill: none; stroke: #38bdf8; stroke-width: 1.5; opacity: 0.4; }
      .pulse-node { animation: pulse 3s infinite ease-in-out; }
      .scan-line { animation: scan 4s linear infinite; }
      .title-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 34px; fill: url(#text-gradient); }
      .subtitle-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 16px; fill: #94a3b8; }
      .badge-tag { font-family: monospace; font-size: 12px; fill: #00f2fe; letter-spacing: 2px; }
      
      @keyframes pulse {
        0%, 100% { r: 4px; opacity: 0.3; }
        50% { r: 8px; opacity: 0.9; }
      }
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.4; }
        100% { transform: translateY(240px); opacity: 0.1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bg-gradient)" rx="12" />
  
  <!-- Dynamic Glow Layer -->
  <circle cx="200" cy="120" r="180" fill="url(#glow)" />
  <circle cx="750" cy="100" r="150" fill="url(#glow)" />

  <!-- Dynamic Cyber Grid & Network Graphic (Background) -->
  <g opacity="0.6">
    <line x1="0" y1="60" x2="900" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="900" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="900" y2="180" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="240" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="240" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="240" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="240" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="240" class="grid-line" />

    <!-- Animated Nodes -->
    <circle cx="750" cy="60" r="5" class="pulse-node" fill="#00f2fe" />
    <circle cx="820" cy="120" r="6" class="pulse-node" fill="#38bdf8" style="animation-delay: 1s;" />
    <circle cx="680" cy="180" r="4" class="pulse-node" fill="#818cf8" style="animation-delay: 2s;" />
    
    <!-- Shield Graphic Background Right -->
    <path d="M780,50 L830,70 L830,130 C830,165 780,185 780,185 C780,185 730,165 730,130 L730,70 Z" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
    <path d="M780,65 L815,80 L815,125 C815,150 780,168 780,168 C780,168 745,150 745,125 L745,80 Z" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.35" />
  </g>

  <!-- Foreground Content (Title & Subtitle explicitly above dynamic elements) -->
  <g transform="translate(50, 0)">
    <!-- Tag -->
    <text x="0" y="65" class="badge-tag">🛡️ CURATED CYBERSECURITY ECOSYSTEM</text>
    
    <!-- Title -->
    <text x="0" y="112" class="title-text">Awesome Managed Detection &amp; Response</text>
    
    <!-- Subtitle -->
    <text x="0" y="150" class="subtitle-text">Top MDR SaaS Platforms, EDR/XDR Solutions &amp; Open-Source SOC Frameworks</text>

    <!-- Accent Line -->
    <rect x="0" y="175" width="220" height="4" rx="2" fill="url(#accent-gradient)" />
  </g>

  <!-- Border Frame -->
  <rect width="900" height="240" fill="none" stroke="#1e293b" stroke-width="2" rx="12" />
</svg>
